version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: agroride-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password123}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-agroride}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - agroride-network

  # Redis for caching and sessions
  redis:
    image: redis:7.2-alpine
    container_name: agroride-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - agroride-network

  # Backend API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agroride-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/agroride?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-here}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_key_id}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-rzp_test_key_secret}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-your-webhook-secret}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://your-domain.com}
      NEXT_PUBLIC_API_URL: https://your-domain.com/api
      NEXT_PUBLIC_SOCKET_URL: https://your-domain.com
    ports:
      - "3001:3001"
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./uploads:/app/uploads
    networks:
      - agroride-network

  # Next.js Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: agroride-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://your-domain.com/api
      NEXT_PUBLIC_SOCKET_URL: https://your-domain.com
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - agroride-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: agroride-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./uploads:/var/www/uploads:ro
    depends_on:
      - frontend
      - api
    networks:
      - agroride-network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  agroride-network:
    driver: bridge